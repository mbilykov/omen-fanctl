name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Lint Python sources
        run: pipx run ruff==0.16.6 check src tests utils

      - name: Check Python formatting
        run: pipx run ruff==0.16.6 format --check src tests

      - name: Check shell script syntax
        run: >
          bash -n install.sh uninstall.sh src/install/config.sh
          utils/dump_hp_wmi_2f.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck

      - name: Lint shell scripts
        run: >
          shellcheck install.sh uninstall.sh src/install/config.sh
          utils/dump_hp_wmi_2f.sh
