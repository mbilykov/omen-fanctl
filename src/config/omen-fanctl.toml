[daemon]
# This daemon refuses to run on any unlisted system board.
allowed_boards = ["8D87"]
required_profile = "performance"

# Read temperatures every second. Rising targets may be sent on every sample so
# a sudden CPU boost does not outrun EWMA. Reductions occur at most every five
# seconds, matching the cadence found in HP Gaming Hub's older control loop.
sample_interval_s = 1.0
control_interval_s = 5.0

# Below activation temperature the firmware remains in Auto. The release value
# is an upper hysteresis limit; fan_stop_temp_c below is the stricter CPU/GPU
# condition for returning active software control to Auto.
activation_temp_c = 60.0
release_temp_c = 52.0

# Manual mode cannot reproduce the firmware's zero-RPM behavior: the lowest
# supported software curve level still spins both fans. Hand control to Auto as
# soon as raw CPU/GPU temperatures are at or below this threshold. EWMA does
# not delay this decision; the post-Auto guard covers any thermal rebound.
fan_stop_temp_c = 45.0

# Upper temperature for handing the fans back to firmware Auto when the daemon
# is asked to stop. A stop signal is not a crash: reboot and poweroff arrive as
# SIGTERM while software control is usually still active, and answering them
# with maximum fans keeps the machine at full speed through shutdown and into
# the next power-on. Below this temperature the fans return to Auto instead.
# The unconditional maximum-fan fail-safe stays in place above this
# temperature, when maximum mode is already selected by this daemon or asserted
# externally, when the fan mode is unreadable or is not one this daemon
# recognises, and when the last sample is not a trustworthy description of the
# machine being handed over: temperatures unreadable, more than five seconds
# old, carrying a reading reused after a failed query, taken while a source
# this daemon depends on is failing, or missing a sensor that activated the
# current Manual cycle and has not yet aged out. That last rule
# is the one the normal Auto handoff applies, so a stop cannot step around it.
# All of this matters because the firmware fan-stop window below is unattended
# once the daemon is gone. The freshness limit is measured against the sample
# itself, so a sample_interval_s above five seconds hands off only when a stop
# happens to arrive within five seconds of one; the daemon logs one warning
# when it starts on such a cadence. Freshness is measured on
# CLOCK_BOOTTIME, so a reading taken before a system suspend never counts as
# recent. Set false to always select maximum fans on stop. Crashes, hangs and
# SIGKILL are unaffected: they never reach this decision.
#
# Omitting this key entirely also means false, which is what an installation
# upgraded from a release without it keeps until the key is added by hand or by
# install.sh --replace-config.
stop_handoff_max_temp_c = 70.0

# This firmware can stop both fans for roughly 90-120 seconds after Manual ->
# Auto. After that transition, keep monitoring temperatures for three minutes
# before sleeping. New heat immediately reactivates userspace fan control. The
# daemon refuses values below the observed 120-second firmware window.
auto_guard_s = 180.0

# Raw temperature at or above this threshold leaves Manual control and selects
# firmware Max. This is a deliberate Linux 7.1 compatibility compromise: its
# single pwm1 channel turns Manual level 60 into CPU/GPU levels 60/62, exceeding
# the level-60 range. Upstream Linux has replaced that offset with independent
# pwm1/pwm2 channels. The daemon detects that ABI and maps separate CPU/GPU
# targets through the captured firmware table; on the single-channel
# interface it refuses any active curve or Manual floor whose upper request maps
# above CPU level 56. That is the highest CPU level whose legacy +2 GPU request
# stays within the firmware-observed GPU ceiling of 58. Emergency provides the
# remaining full-cooling path.
critical_temp_c = 92.0

# Maximum mode is still entered when a sensor is lost during control, and is
# adopted from a crashed run that left the fans at maximum. Those states are
# released once the smoothed temperature falls below critical_release_temp_c
# and maximum has been held for at least emergency_hold_s.
critical_release_temp_c = 82.0
emergency_hold_s = 10.0

# Behavioural cost of this compromise: a sustained load that crosses 92 C at
# the 56/58 Manual pair enters firmware Max immediately, stays there for at
# least 10 seconds and until the smoothed temperature falls to 82 C, then may
# heat back to 92 C and repeat. The capped curve makes the mode change smaller
# than the factory curve's 47 -> Max jump, but cannot eliminate this cycling.

# Extra temperature applied only when considering a PWM decrease.
decrease_hysteresis_c = 3.0

# WMI IR is reported in whole degrees. IR activates on the first curve step
# above minimum_manual_percent (44 C for the factory curve), then releases the
# Manual cycle one degree below that activation point (43 C).
ir_release_hysteresis_c = 1.0

# PWM rate limits per applied command. Rising commands may be applied on every
# sample; reductions remain limited to control_interval_s. When critical_temp_c
# is configured, crossing it ignores the rise limit and immediately requests
# maximum.
max_rise_percent_per_update = 20.0
max_fall_percent_per_update = 8.0
minimum_manual_percent = 31.6667

[ewma]
# Values stored with this factory Performance configuration in Gaming Hub.
rise_alpha = 0.10
fall_alpha = 0.05

[sensors]
# Optional experimental extension providing Gaming Hub's IR source on 8D87.
# When the optional procfs interface is absent or invalid, the daemon logs one
# warning and continues with CPU/GPU. IR joins automatically whenever it is
# available. If IR activated Manual control and then disappears, it blocks an
# Auto handoff for two missing samples and is released on the third.
include_hp_wmi_ir = true
hp_wmi_sensors_path = "/proc/hp_wmi_sensors"

# Neither Linux acpitz zone is Gaming Hub's IR input. Keep this disabled for
# normal telemetry; --include-acpi-proxy logs and evaluates it only for
# comparison, without allowing it to affect fan control.
include_acpi = false
include_amd_gpu = true
# Uses nvidia-smi when present and rediscovers the tool and NVIDIA PCI runtime
# status paths every 30 seconds. An RTD3-suspended GPU is not queried, so
# telemetry does not wake it and its expected lack of temperature does not
# block return to firmware Auto. A configured active source logs loss and
# recovery. A previously available
# NVIDIA source reuses its last metrics with nvidia_metrics_stale=true for two
# failed reads, then fails safe on the third; runtime suspend ends that cache's
# lifetime. Physical disappearance of a previously available AMD GPU fails safe
# immediately. If its amdgpu hwmon remains present but unreadable, the last AMD
# temperature is reused with
# amd_gpu_temperature_stale=true for two failed reads; the third fails safe.
include_nvidia_gpu = true

[curves]
# Curve tables. CPU, GPU, and IR use independent stepped tables. IR is read
# from index 0 of the optional /proc/hp_wmi_sensors interface.
#
# Two presets are available:
#
#   hp-vibrance-stx-n22x9-performance
#     The factory table extracted from HP.Omen.Core.Common.dll resource
#     PowerControl.JSON.Vibrance_STX_N22X9.json, version 20250930. It tops out
#     at HP fan level 47/60 (~78.3%), which settles this machine near 85 C and
#     leaves the 92 C emergency as the only path to full speed.
#
#   performance-single-channel (default)
#     The factory table plus levels 51, 55, and 56. Linux 7.1 applies its fixed
#     GPU +2 offset, producing pairs 51/53, 55/57, and 56/58. These stay within
#     the maximum CPU/GPU levels observed in the firmware table.
#
#   performance-extended
#     The same table with three CPU steps added above HP's ceiling, reaching CPU
#     level 60 (100%) and mapped GPU level 58 at 90 C. It requires the
#     dual-channel pwm1/pwm2 ABI on 8D87, the board from which the CPU/GPU
#     mapping was captured. Other boards require their own registered mapping.
#     On Linux 7.1, startup rejects this preset because the fixed GPU offset
#     would turn Manual CPU level 60 into GPU 62.
preset = "performance-single-channel"
