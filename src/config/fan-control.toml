[daemon]
# This daemon refuses to run on any unlisted system board.
allowed_boards = ["8D87"]
required_profile = "performance"

# Read temperatures every second. Rising targets may be sent on every sample so
# a sudden CPU boost does not outrun EWMA. Reductions occur at most every five
# seconds, matching the cadence found in HP Gaming Hub's older control loop.
sample_interval_s = 1.0
control_interval_s = 5.0

# Below activation temperature the firmware remains in Auto. The release value
# is an upper hysteresis limit; fan_stop_temp_c below is the stricter CPU/GPU
# condition for returning active software control to Auto.
activation_temp_c = 60.0
release_temp_c = 52.0

# Manual mode cannot reproduce the firmware's zero-RPM behavior: the lowest
# supported software curve level still spins both fans. Hand control to Auto as
# soon as raw CPU/GPU temperatures are at or below this threshold. EWMA does
# not delay this decision; the post-Auto guard covers any thermal rebound.
fan_stop_temp_c = 45.0

# This firmware can stop both fans for roughly 90-120 seconds after Manual ->
# Auto. After that transition, keep monitoring temperatures for three minutes
# before sleeping. New heat immediately reactivates userspace fan control. The
# daemon refuses values below the observed 120-second firmware window.
auto_guard_s = 180.0

# Raw (not smoothed) temperature overrides the curve and requests maximum fans.
# Maximum remains selected for at least emergency_hold_s and until the smoothed
# temperature falls below critical_release_temp_c.
critical_temp_c = 92.0
critical_release_temp_c = 82.0
emergency_hold_s = 10.0

# Extra temperature applied only when considering a PWM decrease.
decrease_hysteresis_c = 3.0

# WMI IR is reported in whole degrees. IR activates on the first curve step
# above minimum_manual_percent (44 C for the factory curve), then releases the
# Manual cycle one degree below that activation point (43 C).
ir_release_hysteresis_c = 1.0

# PWM rate limits per applied command. Rising commands may be applied on every
# sample; reductions remain limited to control_interval_s. A critical-temperature
# transition ignores the rise limit and immediately requests maximum.
max_rise_percent_per_update = 20.0
max_fall_percent_per_update = 8.0
minimum_manual_percent = 31.6667

[ewma]
# Values stored with this factory Performance configuration in Gaming Hub.
rise_alpha = 0.10
fall_alpha = 0.05

[sensors]
# Optional experimental extension providing Gaming Hub's IR source on 8D87.
# When the optional procfs interface is absent or invalid, the daemon logs one
# warning and continues with CPU/GPU. IR joins automatically whenever it is
# available.
include_hp_wmi_ir = true
hp_wmi_sensors_path = "/proc/hp_wmi_sensors"

# Neither Linux acpitz zone is Gaming Hub's IR input. Keep this disabled for
# normal telemetry; --include-acpi-proxy logs and evaluates it only for
# comparison, without allowing it to affect fan control.
include_acpi = false
include_amd_gpu = true
# Uses nvidia-smi when present and retries discovery every 30 seconds. A
# configured source logs loss and recovery. A previously available NVIDIA
# source reuses its last metrics with nvidia_metrics_stale=true for two failed
# reads, then fails safe on the third. Physical disappearance of a previously
# available AMD GPU fails safe immediately. If its amdgpu hwmon remains present
# but unreadable, the last AMD temperature is reused with
# amd_gpu_temperature_stale=true for two failed reads; the third fails safe.
include_nvidia_gpu = true

[curves]
# Extracted from HP.Omen.Core.Common.dll resource
# PowerControl.JSON.Vibrance_STX_N22X9.json, version 20250930. CPU, GPU, and
# IR use independent stepped tables. IR is read from index 0 of the optional
# /proc/hp_wmi_sensors interface. Normal factory Performance tops out at HP fan
# level 47/60 (~78.3%); the daemon's 92 C emergency remains 60/60 (100%).
preset = "hp-vibrance-stx-n22x9-performance"
